[project]
name = "photopicker"
version = "0.12.0"
description = "ML-driven photo selection for project galleries (Aries, Big7, etc.)"
requires-python = ">=3.10"
authors = [{ name = "Michael Murillo Martinez" }]
dependencies = [
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "click>=8.1",
]

[project.optional-dependencies]
clip = [
    "torch>=2.0",
    "transformers>=4.40",
]
vision = [
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
photopicker = "photopicker.cli:main"
photopicker-cull = "photopicker.cli:cull_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photopicker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=photopicker --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"photopicker/profiles/__init__.py" = ["F401"]

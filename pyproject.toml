[project]
name = "photopicker"
version = "0.14.0"
description = "Scriptable photo culling for pipelines — deterministic offline scoring, dedup, quality gate, optional AI rerank"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Michael Murillo Martinez", email = "murillomartinezmichael@gmail.com" }]
keywords = ["photo", "culling", "image-quality", "dedup", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/murillomartinezmichael/PhotoPicker"
Repository = "https://github.com/murillomartinezmichael/PhotoPicker"
Issues = "https://github.com/murillomartinezmichael/PhotoPicker/issues"
Changelog = "https://github.com/murillomartinezmichael/PhotoPicker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
clip = [
    "torch>=2.0",
    "transformers>=4.40",
]
vision = [
    "anthropic>=0.34",
]
faces = [
    # Pinned exact: 0.10.22+ dropped the legacy solutions.face_mesh API this
    # module uses (offline, model bundled in the wheel) for a Tasks API that
    # downloads model assets at runtime. See photopicker/faces.py docstring.
    "mediapipe==0.10.21",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned exact — CI-reproducibility receipt: unpinned ruff broke two
    # fleet repos in one day (0.15.22-vs-0.16.1 drift). 0.15.20 is verified
    # clean on this tree; bump deliberately, not via pip resolution.
    "ruff==0.15.20",
]

[project.scripts]
photopicker = "photopicker.cli:main"
photopicker-cull = "photopicker.cli:cull_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photopicker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=photopicker --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"photopicker/profiles/__init__.py" = ["F401"]

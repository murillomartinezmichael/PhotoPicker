name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Cap runaway runs: normal matrix-leg runtime is ~1-2 min, but the
    # 2026-08-06 hosted-runner acquisition outage burned 2x15m here.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check photopicker tests

      - name: Test
        run: pytest --cov=photopicker --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  faces:
    name: faces extra (optional-dependency coverage)
    runs-on: ubuntu-latest
    # Verified 2026-08-08 in python:3.11-slim: `pip install -e ".[dev,faces]"`
    # resolves mediapipe 0.10.21 and all 7 face tests pass in 0.89s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # mediapipe imports cv2, which needs libGL at import time.
      - name: System libs for mediapipe/opencv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0

      - name: Install with the faces extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,faces]"

      # The whole point of this job. tests/test_faces.py is gated by
      # `pytest.importorskip("mediapipe")`, so a broken or uninstallable extra
      # turns into a silent skip that still reports green -- which is how
      # Dependabot PR #6 (mediapipe 1.0.0, an API-removing major) collected
      # five green checks for tests that never ran. Assert the import here so
      # the failure is the install, not a skip.
      - name: Assert the extra actually imported
        run: python -c "import mediapipe; print('mediapipe', mediapipe.__version__)"

      - name: Face/eye tests — must run, not skip
        run: |
          set -o pipefail
          pytest tests/test_faces.py --no-cov -q -rs | tee faces.log
          if grep -qE "skipped|no tests ran" faces.log; then
            echo "::error::tests/test_faces.py skipped instead of running -- the faces extra did not take effect"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

# Cancel superseded runs of the same ref — CI-budget discipline (2026-07-19).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
